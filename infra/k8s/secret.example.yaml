# Template for sensitive configuration. DO NOT commit a populated copy of
# this file to version control — generate real secrets and apply with:
#
#   kubectl create secret generic tarzan-secrets \
#     --namespace tarzan \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://tarzan:...@postgres:5432/tarzan' \
#     --from-literal=SECRET_KEY='...' \
#     --from-literal=FIELD_ENCRYPTION_KEY='...' \
#     --from-literal=ADMIN_USERNAME='admin' \
#     --from-literal=ADMIN_PASSWORD='...' \
#     --from-literal=ADMIN_EMAIL='admin@example.com'
#
# Generate SECRET_KEY / FIELD_ENCRYPTION_KEY with:
#   python -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
#
# The manifest below is provided for reference / kustomize secretGenerator
# use and uses obvious placeholder values that MUST be replaced.
apiVersion: v1
kind: Secret
metadata:
  name: tarzan-secrets
  namespace: tarzan
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgresql+asyncpg://tarzan:REPLACE_ME@postgres:5432/tarzan"
  SECRET_KEY: "REPLACE_ME_32_CHAR_MINIMUM_RANDOM_STRING_xxxxxxxxx"
  FIELD_ENCRYPTION_KEY: "REPLACE_ME_BASE64URL_32_BYTE_KEY"
  # Initial admin bootstrap — remove once the first admin account exists.
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "REPLACE_ME_12_CHAR_MINIMUM"
  ADMIN_EMAIL: "admin@example.com"
