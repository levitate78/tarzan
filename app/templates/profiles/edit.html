{% extends "base.html" %}
{% block title %}{% if mode == "new" %}Add team member{% else %}Edit {{ profile.name }}{% endif %}{% endblock %}
{% block content %}
<section class="narrow-panel">
  <h1>{% if mode == "new" %}Add team member{% else %}Edit {{ profile.name }}{% endif %}</h1>
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p>
      <label for="name">Name (required)</label>
      <input type="text" id="name" name="name" required value="{{ profile.name if profile else '' }}">
    </p>
    <p>
      <label for="username">Username (required)</label>
      <input type="text" id="username" name="username" required value="{{ profile.username if profile else '' }}">
    </p>
    <p>
      <label for="jira_account_id">Jira account ID (used for work item filtering and reassignment)</label>
      <input type="text" id="jira_account_id" name="jira_account_id" value="{{ profile.jira_account_id if profile and profile.jira_account_id else '' }}">
    </p>
    <p>
      <label for="gitlab_username">GitLab username (used for merge request filtering)</label>
      <input type="text" id="gitlab_username" name="gitlab_username" value="{{ profile.gitlab_username if profile and profile.gitlab_username else '' }}">
    </p>
    <p>
      <label for="avatar">Avatar photo (JPEG, PNG, GIF, or WebP, up to 5 MB)</label>
      <input type="file" id="avatar" name="avatar" accept="image/jpeg,image/png,image/gif,image/webp">
    </p>
    <p>
      <button type="submit">{% if mode == "new" %}Create profile{% else %}Save changes{% endif %}</button>
      <a class="button-link secondary" href="{{ url_for('profiles.index') }}">Cancel</a>
    </p>
  </form>
</section>
{% endblock %}
